name: Java App CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'java-app/**' # Only trigger if files in this folder change!
  pull_request:
    branches: [ "main" ]
    paths:
      - 'java-app/**'

jobs:
  build:
    name: Continuous Integration (CI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./java-app
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: compile
        run: mvn compile

      - name: Run Tests
        run: mvn test

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Test Docker Build
        run: docker build -t test-java-app .